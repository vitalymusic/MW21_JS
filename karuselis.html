<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Karuselis</title>

    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .vk-karuselis{
            max-width: 1200px;
            margin:10px auto;
            font-family: sans-serif;
        }

        .slide{

            display: none;

            h3{
                position: relative;
                top:calc(400px / 2 - 400px);
               text-align: center;
                font-size: 3rem;
                color:#fff;
            }
            a{
                 position: relative;
                 top:calc(400px / 2 - 400px);
                 left:calc(1200px - 150px);
                 color: #fff;
                 text-decoration: none;
                 &:hover{
                    font-size: 1.5rem;
                    transition: .5s;
                 }
            }

        }

        .active_slide{
            display: block;
        }

        .buttons{
            position: relative;
            top:-70px;
            display: flex;
            justify-content: center;
            gap:20px;

            button{
                padding: 5px 10px;
                border:none;
                background-color: #c8c8c8;
                border-radius: 5px;
                cursor: pointer;
                &:hover{
                    background-color: #a0a0a0;
                }
            }
        }


        /* Animācijas */
        .active_slide{animation:flip-in-ver-right .5s cubic-bezier(.445,.05,.55,.95) both}
        
        @keyframes flip-in-ver-right{0%{transform:rotateY(-80deg);opacity:0}100%{transform:rotateY(0);opacity:1}}
         /* Animācijas */
    </style>
</head>
<body>
    <h1>Karuselis</h1>

    <div class="vk-karuselis">
        <div class="slides">
            <div class="slide active_slide">
                <img src="https://picsum.photos/id/10/1200/400" alt="">
                <h3>Slaids 1</h3>
                <a href="#">Lasīt tālāk</a>
            </div>
            <div class="slide">
                <img src="https://picsum.photos/id/11/1200/400" alt="">
                <h3>Slaids 2</h3>
                <a href="#">Lasīt tālāk</a>
            </div>
            <div class="slide">
                <img src="https://picsum.photos/id/12/1200/400" alt="">
                <h3>Slaids 3</h3>
                <a href="#">Lasīt tālāk</a>
            </div>
        </div>
        <div class="buttons">
            <button>left</button>
            <button>right</button>
        </div>


    </div>



    <script>
        // Šeit nāks JS kods
        let slides = document.querySelectorAll('.slide');
        let buttons = document.querySelectorAll('.buttons button');
        let slideNumber = 0;

        function showSlide(number){
            for(slide of slides){
                slide.classList.remove('active_slide');
            }
            slides[number].classList.add('active_slide');
        }


        function nextSlide(){

            slideNumber++;
            if(slideNumber > slides.length-1){
                slideNumber = 0;
            }
            showSlide(slideNumber)

        }
         function previusSlide(){
             slideNumber--;
             if(slideNumber < 0){
                slideNumber = slides.length-1
             }
            showSlide(slideNumber)
        }

        buttons[0].onclick = previusSlide;
        buttons[1].onclick = nextSlide;




        showSlide(0)


        window.onkeydown = (e)=>{
            console.log(e)
            if(e.code=="ArrowLeft"){
                previusSlide()
            }
            if(e.code=="ArrowRight"){
                nextSlide()
            }
        }


    </script>
</body>
</html>
